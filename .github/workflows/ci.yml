name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore test project and dependencies
        run: dotnet restore tests/LongPizzaOrderBuilder.Tests/LongPizzaOrderBuilder.Tests.csproj
      - name: Build API
        run: dotnet build src/backend/LongPizzaOrderBuilder.Api/LongPizzaOrderBuilder.Api.csproj --configuration Release --no-restore
      - name: Run unit and API integration tests
        run: dotnet test tests/LongPizzaOrderBuilder.Tests/LongPizzaOrderBuilder.Tests.csproj --configuration Release --no-restore --verbosity normal

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build

  container-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f deploy/docker/api.Dockerfile -t longpizzaorderbuilder-api:${{ github.sha }} .
      - name: Build worker image
        run: docker build -f deploy/docker/worker.Dockerfile -t longpizzaorderbuilder-worker:${{ github.sha }} .
      - name: Build production frontend image
        run: docker build -f deploy/docker/frontend.Dockerfile -t longpizzaorderbuilder-frontend:${{ github.sha }} .
      - name: Run self-hosted Compose smoke test
        env:
          POSTGRES_DB: longpizza_ci
          POSTGRES_USER: longpizza_ci
          POSTGRES_PASSWORD: ci-postgres-password
          RABBITMQ_DEFAULT_USER: ci-rabbit
          RABBITMQ_DEFAULT_PASS: ci-rabbit-password
          HTTP_PORT: 8088
        run: |
          set -euo pipefail
          cleanup() { docker compose -f compose.selfhost.yaml down -v; }
          trap cleanup EXIT
          docker compose -f compose.selfhost.yaml up --build -d
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://localhost:8088/health
          curl --fail --retry 10 --retry-delay 2 http://localhost:8088/api/menu > /tmp/longpizza-menu.json
          python -m json.tool /tmp/longpizza-menu.json
