name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore Unit Tests project and dependencies
        run: dotnet restore tests/LongPizzaOrderBuilder.UnitTests/LongPizzaOrderBuilder.UnitTests.csproj
      - name: Restore Integration Tests project and dependencies
        run: dotnet restore tests/LongPizzaOrderBuilder.IntegrationTests/LongPizzaOrderBuilder.IntegrationTests.csproj
      - name: Build the order builder API
        run: dotnet build src/backend/LongPizzaOrderBuilder.Api/LongPizzaOrderBuilder.Api.csproj --configuration Release --no-restore
      - name: Build the order service
        run: dotnet build src/backend/LongPizzaOrderBuilder.OrderService/LongPizzaOrderBuilder.OrderService.csproj --configuration Release --no-restore
      - name: Run unit integration tests
        run: dotnet test tests/LongPizzaOrderBuilder.UnitTests/LongPizzaOrderBuilder.UnitTests.csproj --configuration Release --no-restore --verbosity normal
      - name: Run API integration tests
        run: dotnet test tests/LongPizzaOrderBuilder.IntegrationTests/LongPizzaOrderBuilder.IntegrationTests.csproj --configuration Release --no-restore --verbosity normal


  frontend:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  invariants:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check that docs/INVARIANTS.md and the tests agree
        run: node scripts/check-invariants.mjs

  container-build:
    runs-on: ubuntu-26.04
    needs: [backend, frontend, invariants]
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -f deploy/docker/api.Dockerfile -t longpizzaorderbuilder-api:${{ github.sha }} .
      - name: Build order service image
        run: docker build -f deploy/docker/orderservice.Dockerfile -t longpizzaorderbuilder-orderservice:${{ github.sha }} .
      - name: Build production frontend image
        run: docker build -f deploy/docker/frontend.Dockerfile -t longpizzaorderbuilder-frontend:${{ github.sha }} .
      - name: Run self-hosted Compose smoke test
        env:
          HTTP_PORT: 8088
        run: |
          set -euo pipefail
          cleanup() { docker compose -f compose.selfhost.yaml down -v; }
          trap cleanup EXIT
          
          docker compose -f compose.selfhost.yaml up --build -d --wait --wait-timeout 120
          
          curl --fail --show-error \
            --retry 30 --retry-delay 2 \
            --retry-connrefused --retry-all-errors \
            http://localhost:8088/health

          
          curl --fail --show-error \
            --retry 10 --retry-delay 2 \
            --retry-connrefused --retry-all-errors \
            http://localhost:8088/api/menu \
            > /tmp/longpizza-menu.json
            
          python -m json.tool /tmp/longpizza-menu.json

          # The order service is a separate process behind the same site: an unknown order id must be answered by it with a 404.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/api/orders/does-not-exist)" = 404
