# Self-hosting deployment scaffold. Orders are held in the order service's memory (lost on restart) until persistence is built
# (see docs/FUTURE-WORK.md), so this is for demos and checking the container wiring, not for real customers.
services:
  frontend:
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy
      orderservice:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  # The order service: a separate process. Reachable only through the site's /api/orders path. The restaurant routes are not published.
  orderservice:
    build:
      context: .
      dockerfile: deploy/docker/orderservice.Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8090
      # The restaurant is simulated by a timer here, since its routes are not published: each order moves one step per this many seconds.
      Restaurant__AutoAdvanceSeconds: ${RESTAURANT_AUTO_ADVANCE_SECONDS:-30}
    expose:
      - "8090"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8090/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
