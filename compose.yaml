services:
  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  # The order service: a separate process that holds orders and their lifecycle. The restaurant side is on the same port under /api/restaurant.
  orderservice:
    build:
      context: .
      dockerfile: deploy/docker/orderservice.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8090
      Cors__AllowedOrigins__0: http://localhost:5173
      # 0 = the restaurant is simulated by hand (scripts/restaurant.sh). Set e.g. 30 to move every order one step per 30 s.
      Restaurant__AutoAdvanceSeconds: ${RESTAURANT_AUTO_ADVANCE_SECONDS:-0}
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8090/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./src/frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8080
      VITE_ORDER_SERVICE_URL: http://localhost:8090
    depends_on:
      api:
        condition: service_healthy
      orderservice:
        condition: service_healthy

volumes:
  frontend_node_modules:
